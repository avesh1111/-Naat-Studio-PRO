name: Check iOS App Build
on:
  push:
    paths:
      - 'ios/**'
      - 'app/src/main/assets/**'
      - '.github/workflows/build-ios.yml'
  workflow_dispatch:

jobs:
  ios-simulator-build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode Project
        run: cd ios && xcodegen generate
      - name: Compile iPhone Simulator
        run: |
          xcodebuild -project ios/NaatStudioPRO.xcodeproj -scheme NaatStudioPRO \
            -sdk iphonesimulator -configuration Debug -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build
      - name: Upload source and build diagnostics
        if: failure()
        run: |
          echo 'iOS simulator compilation failed; inspect the preceding xcodebuild output.'
